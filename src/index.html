<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Inventario Patrimonio Artístico UPB</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Antes de arrancar Angular, para que la página no parpadee en claro con el tema oscuro elegido.
      (function () {
        var tema = null;
        try { tema = localStorage.getItem('tema'); } catch (e) {}
        if (tema !== 'claro' && tema !== 'oscuro') {
          tema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
        }
        document.documentElement.setAttribute('data-theme', tema);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
