@if (totalPaginas() > 1) {
  <nav class="flex items-center justify-center gap-0.5 pt-2 sm:gap-1.5" aria-label="Paginación">
    <button type="button" aria-label="Página anterior" [disabled]="paginaActual() <= 1" (click)="ir(paginaActual() - 1)"
      class="grid h-9 w-8 place-items-center rounded-lg text-tinta-3 hover:text-tinta disabled:opacity-30 sm:w-9">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <ul class="flex items-center gap-0.5 sm:gap-1.5">
      @for (pagina of paginas(); track $index) {
        <li>
          @if (pagina === null) {
            <span class="grid h-9 w-7 place-items-center text-sm font-semibold text-tinta-5 sm:w-9" aria-hidden="true">…</span>
          } @else {
            <button type="button" [attr.aria-label]="'Página ' + pagina" [attr.aria-current]="pagina === paginaActual() ? 'page' : null" (click)="ir(pagina)"
              [class]="pagina === paginaActual()
                ? 'h-9 min-w-8 border-b-2 border-acento px-1.5 text-sm font-semibold text-tinta sm:min-w-9'
                : 'h-9 min-w-8 border-b-2 border-transparent px-1.5 text-sm font-medium text-tinta-4 hover:text-tinta sm:min-w-9'">{{ pagina }}</button>
          }
        </li>
      }
    </ul>
    <button type="button" aria-label="Página siguiente" [disabled]="paginaActual() >= totalPaginas()" (click)="ir(paginaActual() + 1)"
      class="grid h-9 w-8 place-items-center rounded-lg text-tinta-3 hover:text-tinta disabled:opacity-30 sm:w-9">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
    </button>
  </nav>
}
