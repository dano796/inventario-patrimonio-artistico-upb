<div class="tarjeta overflow-x-auto px-5 pb-3.5 pt-1.5">
  <table class="w-full min-w-[720px] border-collapse text-left text-[13px] font-medium">
    <thead>
      <tr class="border-b border-linea text-[11px] uppercase tracking-[0.08em] text-tinta-5">
        <th scope="col" class="py-3 pr-4 font-semibold">Obra</th>
        <th scope="col" class="py-3 pr-4 font-semibold">Autor</th>
        <th scope="col" class="w-40 py-3 pr-4 font-semibold">Técnica</th>
        @if (esAdmin()) {
          <th scope="col" class="w-44 py-3 pr-4 font-semibold">Ubicación</th>
        }
        <th scope="col" class="w-16 py-3 font-semibold">Año</th>
      </tr>
    </thead>
    <tbody>
      @for (obra of obras(); track obra.id) {
        <tr class="border-b border-linea-00 last:border-0">
          <td class="py-[11px] pr-4">
            <a [routerLink]="['/obra', obra.id]" class="font-semibold text-tinta hover:text-acento-tinta">{{ titulo(obra) }}</a>
          </td>
          <td class="max-w-[16rem] truncate py-[11px] pr-4 text-tinta-4">{{ texto(obra.autor) }}</td>
          <td class="py-[11px] pr-4 text-tinta-4">{{ texto(obra.tecnica) }}</td>
          @if (esAdmin()) {
            <td class="py-[11px] pr-4 text-tinta-4">{{ texto(obra.ubicacion) }}</td>
          }
          <td class="py-[11px] text-tinta-4">{{ texto(obra.ano) }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
