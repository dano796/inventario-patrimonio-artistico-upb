<input type="checkbox" class="peer absolute inset-0 m-0 cursor-pointer opacity-0 disabled:cursor-not-allowed" [id]="id()" [checked]="marcada()"
  [disabled]="deshabilitada()" [attr.aria-label]="etiqueta()" (change)="cambio.emit($any($event.target).checked)" />
<span class="pointer-events-none grid h-full w-full place-items-center rounded-[6px] border-[1.5px] transition-colors peer-hover:border-acento-linea peer-focus-visible:shadow-anillo peer-disabled:opacity-50"
  [class]="marcada() ? '!border-acento bg-acento text-white' : 'border-linea-3 bg-superficie text-transparent'" aria-hidden="true">
  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
</span>
