@if (abierto()) {
  <div class="fixed inset-0 z-50 grid place-items-center bg-slate-900/45 p-6" (click)="cerrar(false)">
    <div class="tarjeta w-full max-w-[430px] px-7 py-[26px]" role="dialog" aria-modal="true" aria-labelledby="titulo-confirmacion"
      (click)="$event.stopPropagation()">
      <div class="mb-3.5 grid h-11 w-11 place-items-center rounded-[14px] bg-rojo-suave text-xl font-bold text-rojo" aria-hidden="true">!</div>
      <h2 id="titulo-confirmacion" class="mb-1.5 text-xl font-bold">{{ titulo() }}</h2>
      @if (mensaje()) {
        <p class="mb-5 text-sm font-medium text-tinta-4">{{ mensaje() }}</p>
      }
      @if (error()) {
        <p role="alert" class="mb-4 rounded-xl border border-rojo-linea bg-rojo-tenue px-3.5 py-2.5 text-sm font-medium text-rojo-2">{{ error() }}</p>
      }
      <div class="flex justify-end gap-2.5">
        <button type="button" class="btn-secundario" [disabled]="cargando()" (click)="cerrar(false)">Cancelar</button>
        <button type="button" [disabled]="cargando()" (click)="cerrar(true)"
          class="inline-flex items-center gap-2 rounded-xl bg-rojo px-[18px] py-2.5 text-sm font-semibold text-white hover:bg-rojo-2 disabled:opacity-60">
          {{ cargando() ? 'Eliminando…' : textoConfirmar() }}
        </button>
      </div>
    </div>
  </div>
}
