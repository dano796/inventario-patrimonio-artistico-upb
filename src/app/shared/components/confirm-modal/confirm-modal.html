@if (isOpen) {
  <div
    class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50 p-4"
    (click)="closeModal(false)"
    tabindex="-1"
    >
    <div class="relative w-full max-w-md" (click)="$event.stopPropagation()">
      <div class="relative bg-white rounded-lg shadow-sm">
        <button
          type="button"
          class="absolute top-2 right-2 md:top-3 md:right-3 text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 inline-flex justify-center items-center disabled:opacity-50 disabled:cursor-not-allowed"
          (click)="closeModal(false)"
          [disabled]="isLoading"
          >
          <svg
            class="w-3 h-3"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 14 14"
            >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"
              />
          </svg>
          <span class="sr-only">Cerrar modal</span>
        </button>
        <div class="p-4 md:p-5 text-center">
          <ng-icon name="heroExclamationCircle" size="2.5rem" class="mx-auto mb-4 text-gray-400 md:w-12 md:h-12" />
          <h3 class="mb-4 md:mb-5 text-base md:text-lg font-normal text-gray-500">
            {{ title }}
          </h3>
          <!-- Error Message -->
          @if (errorMessage) {
            <div
              class="mb-4 p-3 md:p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg text-sm md:text-base"
              >
              <div class="flex items-center">
                <ng-icon name="heroInformationCircleSolid" size="1.25rem" class="mr-2" />
                <span class="break-words">{{ errorMessage }}</span>
              </div>
            </div>
          }
          <div class="flex flex-col xs:flex-row gap-2 xs:gap-3 justify-center">
            <button
              type="button"
              class="w-full xs:w-auto text-white bg-red-600 hover:bg-red-800 focus:ring-4 focus:outline-none focus:ring-red-300 font-medium rounded-lg text-sm inline-flex items-center justify-center px-4 md:px-5 py-2.5 disabled:opacity-50 disabled:cursor-not-allowed"
              (click)="closeModal(true)"
              [disabled]="isLoading"
              >
              @if (isLoading) {
                <svg
                  class="animate-spin -ml-1 mr-3 h-4 w-4 text-white"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  >
                  <circle
                    class="opacity-25"
                    cx="12"
                    cy="12"
                    r="10"
                    stroke="currentColor"
                    stroke-width="4"
                  ></circle>
                  <path
                    class="opacity-75"
                    fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                  ></path>
                </svg>
              }
              {{ isLoading ? "Eliminando..." : "Sí, confirmar" }}
            </button>
            <button
              type="button"
              class="w-full xs:w-auto py-2.5 px-4 md:px-5 text-sm font-medium text-gray-900 focus:outline-none bg-white rounded-lg border border-gray-200 hover:bg-gray-100 hover:text-blue-700 focus:z-10 focus:ring-4 focus:ring-gray-100 disabled:opacity-50 disabled:cursor-not-allowed"
              (click)="closeModal(false)"
              [disabled]="isLoading"
              >
              {{ isLoading ? "Espere..." : "No, cancelar" }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
}
