<div class="fixed inset-0 z-50 grid place-items-center bg-slate-900/45 p-4 backdrop-blur-md sm:p-6" (click)="cerrar.emit()">
  <div class="flex max-w-full flex-col items-end gap-2.5 outline-none" role="dialog" aria-modal="true" [attr.aria-label]="descripcion() || 'Imagen ampliada'"
    tabindex="-1" (click)="$event.stopPropagation()" (keydown)="retenerFoco($event)">
    <button type="button" aria-label="Cerrar" (click)="cerrar.emit()"
      class="grid h-10 w-10 place-items-center rounded-full border border-linea-2 bg-superficie text-tinta-2 shadow-tarjeta hover:border-linea-3 hover:bg-sub">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
    </button>
    <div class="tarjeta p-4 sm:p-10">
      <img [src]="url()" [alt]="descripcion()" class="block max-h-[72vh] max-w-full rounded-[14px] object-contain sm:max-w-[min(80vw,960px)]" />
    </div>
  </div>
</div>
